<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WITH YOU POS</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="WITH YOU">
<meta name="theme-color" content="#794523"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: counter screen. Menu tiles fill the left, the running bill stays fixed on the right like a ticket on the rail. */
:root{
  --ground:#EEF1F4; --surface:#F7F9FB; --raised:#FFFFFF; --ink:#2A2B30; --muted:#5B6470; --line:#CDD4DC;
  --leaf:#794523; --leaf-ink:#FFFFFF; --leaf-soft:#F1E4DA; --sky:#4F6781; --sky-ink:#FFFFFF; --sun:#EDB000; --leaf-hover:#8E5530; --leaf-press:#5E3519; --leaf-ring:#E6CDB9; --sky-ring:#C9D5E3; --cherry-press:#9E2E21; --off:#D6D1CB; --off-ink:#FFFFFF; --lift:0 3px 6px rgba(42,43,48,.16),0 1px 2px rgba(42,43,48,.10); --lift-sm:0 2px 4px rgba(42,43,48,.12); --cherry:#C23A2B; --cherry-soft:#F8E0DC; --amber:#8A5A00; --amber-soft:#F6E9C8;
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif; --body:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#1D2127; --surface:#22272E; --raised:#272C33; --ink:#E9ECF0; --muted:#A0A9B5; --line:#3A414B;
  --leaf:#C98A5E; --leaf-ink:#1D140E; --leaf-soft:#3A2C22; --sky:#8FA6C2; --sky-ink:#14181D; --sun:#EDB000; --leaf-hover:#D9A27B; --leaf-press:#B07247; --leaf-ring:#5C4130; --sky-ring:#3E4D60; --cherry-press:#D9695B; --off:#3A414B; --off-ink:#7C8590; --lift:0 3px 8px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.35); --lift-sm:0 2px 4px rgba(0,0,0,.35); --cherry:#F08A7C; --cherry-soft:#45252A; --amber:#E9BE62; --amber-soft:#3B3019; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#1D2127; --surface:#22272E; --raised:#272C33; --ink:#E9ECF0; --muted:#A0A9B5; --line:#3A414B;
  --leaf:#C98A5E; --leaf-ink:#1D140E; --leaf-soft:#3A2C22; --sky:#8FA6C2; --sky-ink:#14181D; --sun:#EDB000; --leaf-hover:#D9A27B; --leaf-press:#B07247; --leaf-ring:#5C4130; --sky-ring:#3E4D60; --cherry-press:#D9695B; --off:#3A414B; --off-ink:#7C8590; --lift:0 3px 8px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.35); --lift-sm:0 2px 4px rgba(0,0,0,.35); --cherry:#F08A7C; --cherry-soft:#45252A; --amber:#E9BE62; --amber-soft:#3B3019; color-scheme:dark}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px;min-height:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:700 20px/1.1 var(--display);min-width:0}
.logo{width:40px;height:40px;border-radius:50%;flex:none;display:block}
.gate .logo{width:88px;height:88px;justify-self:center}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{padding:9px 16px;border-radius:7px;font-weight:500;min-height:44px}
.tab[aria-selected="true"]{background:var(--sky);color:var(--sky-ink)}
.notice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--amber-soft);color:var(--amber);padding:7px 12px;border-radius:8px;font-size:14px}
.view{min-height:0;height:100%}
.sell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;height:100%;min-height:0}
.menu-side{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.cats{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.cat{flex:none;padding:9px 16px;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.cat.on{background:var(--sky);color:var(--sky-ink);border-color:var(--sky)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;overflow-y:auto;align-content:start;flex:1;min-height:0;padding-bottom:6px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:104px}
.tile b{font-weight:600;line-height:1.3}
.tile .pr{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.tile .pr span b{color:var(--ink);font:600 15px var(--display)}
.tile.out{opacity:.5}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--cherry-soft);color:var(--cherry)}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.wait{background:var(--amber-soft);color:var(--amber)}
.empty{padding:32px 16px;color:var(--muted);text-align:center;display:grid;gap:12px;justify-items:center}
.bill{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:0;overflow:hidden}
.bill-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px dashed var(--line)}
.bill-h h2{font:600 17px var(--display);margin:0;margin-right:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:7px 12px;font-size:14px;min-height:44px}
.seg button.on{background:var(--sky);color:var(--sky-ink);font-weight:600}
.lines{flex:1;overflow-y:auto;min-height:80px;padding:4px 12px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:9px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line small{color:var(--muted);grid-column:1;font-size:13px}
.qty{display:flex;align-items:center;gap:4px;grid-column:1}
.qty button{width:44px;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--raised);font:600 18px var(--display)}
.qty span{min-width:26px;text-align:center}
.line .amt{grid-row:1;grid-column:2;font-weight:600}
.bill-f{padding:10px 12px;border-top:1px dashed var(--line);display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{color:var(--leaf);font-weight:600;min-height:44px;padding-inline:8px}
.link.danger{color:var(--cherry)}
.total{font:700 32px/1.1 var(--display)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:50px;padding:8px 14px;border-radius:8px;font-weight:600;border:1px solid var(--line);background:var(--raised)}
.btn.main{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.danger{background:var(--cherry);color:var(--raised);border-color:var(--cherry)}
.btn:disabled{opacity:.45;cursor:default}
.scroll{height:100%;overflow-y:auto;padding-bottom:20px}
.narrow{max-width:900px;margin-inline:auto;display:grid;gap:16px}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar h2{font:600 19px var(--display);margin:0 auto 0 0}
.iconbtn{min-width:46px;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--raised);font:600 18px var(--display)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpis div{min-width:0}
.kpis label{display:block;color:var(--muted);font-size:13px}
.kpis strong{font:700 26px/1.2 var(--display)}
.kpis div:first-child strong{color:var(--leaf)}
.panel{display:grid;gap:10px;align-content:start}
.panel h3{font:600 16px var(--display);margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--leaf);border-radius:2px 2px 0 0;min-height:0}
.axis{display:flex;gap:3px;color:var(--muted);font-size:11px}
.axis span{flex:1;text-align:center;min-width:0;overflow:visible;white-space:nowrap}
.rank{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;margin:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .g{flex:1;min-width:150px}
.li small{display:block;color:var(--muted);font-size:13px}
.voided{text-decoration:line-through;color:var(--muted)}
.backdrop{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:470px;max-height:100%;overflow-y:auto;padding:18px;display:grid;gap:14px}
.sheet h2{font:600 21px/1.2 var(--display);margin:0}
.opt{display:grid;gap:6px}
.opt>span{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:48px;min-width:64px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--raised);font-weight:500}
.chip.on{background:var(--sky);color:var(--sky-ink);border-color:var(--sky)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{height:56px;border:1px solid var(--line);border-radius:8px;background:var(--raised);font:600 22px var(--display)}
.field{display:grid;gap:4px}
.field>span{color:var(--muted);font-size:14px}
.field input,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:9px 11px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qr{justify-self:center;background:#fff;padding:12px;border-radius:8px;width:min(280px,100%)}
.qr svg{display:block;width:100%;height:auto}
.big{font:700 44px/1.1 var(--display)}
.center{text-align:center}
.muted{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;z-index:30;max-width:90%}
@media (max-width:720px){
  html,body{height:auto}
  .app{height:auto;display:flex;flex-direction:column}
  .sell{display:flex;flex-direction:column;height:auto}
  .grid{overflow:visible;grid-template-columns:repeat(2,minmax(0,1fr))}
  .lines{max-height:none}
  .tabs{margin-left:0;width:100%}.tab{flex:1;padding:9px 4px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}
  .scroll{height:auto;overflow:visible}
}
@media (prefers-reduced-motion:no-preference){.tile,.chip,.btn{transition:background .12s}}

.gate{height:100%;display:grid;place-items:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.gate form{width:100%;max-width:380px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.gate h1{font:700 26px/1.1 var(--display);margin:0;text-align:center}
.err{color:var(--cherry);min-height:1.4em;margin:0;font-size:14px}
.kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.kpis small{display:block;color:var(--muted);font-size:13px}
.kpis div.hero{background:var(--leaf-soft);border-radius:8px;padding:10px 12px;margin:-10px 0 -10px -12px}
.kpis div.hero strong,.kpis div.hero label,.kpis div.hero small{color:var(--leaf)}
.payrow{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:14px}.payrow b{color:var(--ink);font-weight:600}
.catbars{display:grid;grid-template-columns:auto minmax(40px,1fr) auto auto;gap:8px 10px;align-items:center}
.ct{height:10px;background:var(--line);border-radius:2px;overflow:hidden}.ct div{height:100%;background:var(--leaf)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tb tr:last-child td{border-bottom:0}.tb th{color:var(--muted);font-weight:500;font-size:13px}.tb th:first-child,.tb td:first-child{text-align:left;white-space:normal}
.daybar .seg button{padding-inline:14px;min-height:46px}
@media (max-width:720px){.kpis{grid-template-columns:minmax(0,1fr)!important}.kpis div.hero{margin:0}}
.grid{grid-auto-rows:max-content}
.tile{min-height:0;padding:0;gap:0;justify-content:flex-start;overflow:hidden;flex:none}
.tile .tn{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;width:100%;text-align:left;padding:9px 10px 7px 12px;font-weight:600;line-height:1.3;min-height:44px}
.tile .more{flex:none;font-size:18px;line-height:1.1;font-weight:400;color:var(--muted)}
.tile .pbs{display:flex;border-top:1px solid var(--line)}
.tile .pb{flex:1;min-height:44px;padding:6px 4px;color:var(--muted);font-size:13px;text-align:center}
.tile .pb+.pb{border-left:1px solid var(--line)}
.tile .pb b{color:var(--ink);font:600 16px var(--display)}
.tile .pb:active,.tile .tn:active,.tile.one:active{background:var(--leaf-soft)}
.tile.one{flex-direction:row;align-items:center;justify-content:space-between;padding-right:12px}
.tile.one .tn{padding-bottom:10px}.tile.one .pb{flex:none;color:var(--ink);font:600 16px var(--display)}
.tile.out{padding:10px 12px;gap:8px}.tile.out .tn{padding:0;min-height:0}
.gh{grid-column:1/-1;margin:8px 0 0;font:600 15px var(--display);color:var(--muted)}
.gh:first-child{margin-top:0}
.line .le{grid-column:1;display:flex;flex-direction:column;text-align:left;min-height:44px;justify-content:center}
.line .le small{color:var(--muted);font-size:13px}
.line .le:active{background:var(--leaf-soft)}
.line .qty{grid-column:1/-1}
.line.flash{background:var(--leaf-soft)}
@media (prefers-reduced-motion:no-preference){.line{transition:background .5s}}
.sbtn{min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--leaf);font-weight:600}
.sbtn.danger{color:var(--cherry);width:100%}
.hint{margin:0;color:var(--muted);font-size:14px}.hint.warn{color:var(--cherry)}
/* Buttons: normal (lifted), hover, focus ring, press (darker + ring, sinks), progress (spinner), disabled (flat grey) */
.btn,.sbtn,.chip,.keys button,.qty button,.iconbtn,.cat,.tab,.seg button,.tile{transition:background .12s,box-shadow .12s,transform .06s}
.btn,.sbtn,.chip,.keys button,.qty button,.iconbtn,.cat{border-radius:12px;box-shadow:var(--lift)}
.btn{border-color:transparent}
.btn.main{background:var(--leaf);border-color:var(--leaf)}
.tile{border-radius:12px;box-shadow:var(--lift-sm)}
.tabs .tab,.seg{border-radius:10px}
:is(.btn,.sbtn,.chip,.keys button,.qty button,.iconbtn,.cat,.tab,.seg button,.pb,.tn,.le,.link):focus-visible{outline:none;box-shadow:0 0 0 4px var(--sky-ring),var(--lift)}
.btn.main:focus-visible{box-shadow:0 0 0 4px var(--leaf-ring),var(--lift)}
@media (hover:hover){
 .btn.main:not(:disabled):hover{background:var(--leaf-hover);border-color:var(--leaf-hover)}
 :is(.btn:not(.main):not(.danger),.sbtn,.chip:not(.on),.keys button,.qty button,.iconbtn,.cat:not(.on)):not(:disabled):hover{background:var(--surface)}
 .tile .pb:hover,.tile .tn:hover{background:var(--surface)}
}
.btn.main:not(:disabled):active{background:var(--leaf-press);border-color:var(--leaf-press);box-shadow:0 0 0 4px var(--leaf-ring);transform:translateY(2px)}
.btn.danger:not(:disabled):active{background:var(--cherry-press);box-shadow:0 0 0 4px var(--cherry-soft);transform:translateY(2px)}
:is(.btn:not(.main):not(.danger),.sbtn,.chip,.keys button,.qty button,.iconbtn,.cat):not(:disabled):active{background:var(--leaf-soft);box-shadow:0 0 0 4px var(--sky-ring);transform:translateY(2px)}
:is(.btn,.sbtn,.chip,.iconbtn):disabled{opacity:1;background:var(--off);border-color:var(--off);color:var(--off-ink);box-shadow:none;cursor:default}
.btn.busy{position:relative;pointer-events:none}
.btn.busy::before{content:"";display:inline-block;width:16px;height:16px;margin-right:8px;vertical-align:-3px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.btn.busy:disabled{background:var(--leaf);color:var(--leaf-ink)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn,.sbtn,.chip,.keys button,.qty button,.iconbtn,.cat,.tab,.seg button,.tile{transition:none;transform:none!important}.btn.busy::before{animation-duration:2s}}
/* Menu cards: price pills are real buttons with the same states as other buttons */
.tile .pbs{display:flex;gap:8px;padding:2px 10px 10px;border-top:0}
.tile .pb+.pb{border-left:0}
.tile .pb{flex:1;min-height:44px;border-radius:10px;background:var(--leaf-soft);color:var(--leaf);font-size:13px;box-shadow:var(--lift-sm);transition:background .12s,box-shadow .12s,transform .06s,color .12s}
.tile .pb b{color:inherit}
.tile .pb:focus-visible{box-shadow:0 0 0 4px var(--leaf-ring),var(--lift-sm)}
@media (hover:hover){.tile .pb:hover{background:var(--leaf-ring);color:var(--leaf-press)}}
.tile .pb:active,.tile .pb:hover:active{background:var(--leaf);color:var(--leaf-ink);box-shadow:0 0 0 4px var(--leaf-ring);transform:translateY(2px)}
.tile .tn:active{background:var(--surface)}
.tile.one{padding-right:10px}
.tile.one .pb{flex:none;min-width:72px;display:inline-flex;align-items:center;justify-content:center;color:var(--leaf);font:600 16px var(--display)}
.tile.one:active .pb{background:var(--leaf);color:var(--leaf-ink);box-shadow:0 0 0 4px var(--leaf-ring);transform:translateY(2px)}
.tile.one:active{background:var(--raised)}
.tile.out .pill{justify-self:start}
@media (prefers-reduced-motion:reduce){.tile .pb{transition:none;transform:none!important}}
/* Menu cards: the name is a lifted button too (opens options) */
.tile{background:var(--surface)}
.tile .tn{width:auto;margin:10px 10px 8px;padding:8px 10px;min-height:44px;border-radius:10px;background:var(--raised);border:1px solid var(--line);box-shadow:var(--lift-sm);color:var(--ink);transition:background .12s,box-shadow .12s,transform .06s}
.tile .tn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--sky-ring),var(--lift-sm)}
@media (hover:hover){.tile .tn:hover{background:var(--ground)}}
.tile .tn:active,.tile .tn:hover:active{background:var(--leaf-soft);box-shadow:0 0 0 4px var(--sky-ring);transform:translateY(2px)}
.tile .pbs{padding-top:0}
.tile.out{background:var(--surface)}
@media (prefers-reduced-motion:reduce){.tile .tn{transition:none;transform:none!important}}
#print{display:none}
@media print{@page{margin:0}
 html,body{height:auto;background:#fff;color:#000;padding:0}
 .app,#modal,#toast,#login,#splash{display:none!important}
 #print{display:block;width:72mm;padding:3mm 2mm;font:14px/1.35 var(--body);color:#000}
 #print h1{font:700 20px var(--display);text-align:center;margin:0 0 4px}#print p{margin:0;text-align:center}
 #print hr{border:0;border-top:1px dashed #000;margin:6px 0}
 #print .pl{display:flex;justify-content:space-between;gap:8px}#print small{display:block;margin-bottom:3px}
 #print .tot{font-weight:700;font-size:18px}#print .thx{margin-top:8px}}
